    <feature name="V-SYNC" submenu="ĐỒNG BỘ HIỂN THỊ" value="vsync" description="Ngăn hiện tượng xé hình. Có thể làm tăng độ trễ đầu vào." preset="switchauto">
    </feature>
    <feature name="ĐỒNG BỘ GPU CỨNG" submenu="ĐỒNG BỘ HIỂN THỊ" value="gpusync" description="Giảm độ trễ bằng cách giới hạn bộ đệm. Có thể ảnh hưởng hiệu năng. Tốt nhất khi dùng cùng V-Sync." preset="switchauto">
    </feature>
    <feature name="TUA LẠI" value="rewind" description="Lưu trữ các trạng thái trước đây để tua lại trong thời gian thực, nếu lõi có hỗ trợ.">
      <choice name="On" value="1" />
      <choice name="TẮT" value="0" />
    </feature>
    <feature name="BẬT/TẮT TUA NHANH" value="toggle_fast_forward" description="Bật để chuyển đổi tua nhanh thay vì phải giữ nút. Chỉ áp dụng trên các core libretro." preset="switchauto">
    </feature>
    <feature name="TỰ ĐỘNG LƯU/NẠP KHI KHỞI ĐỘNG TRÒ CHƠI" value="autosave" description="Tải điểm lưu mới nhất khi khởi chạy trò chơi và lưu trạng thái khi thoát khỏi trò chơi.">
      <choice name="On" value="1" />
      <choice name="TẮT" value="0" />
    </feature>
    <feature name="XUẤT LƯU SRM KHI ĐANG CHƠI" value="srm_dump_ingame" description="Kiểm tra bản cập nhật của dữ liệu lưu trong game mỗi 10 giây và xuất ra ngay lập tức thay vì chỉ khi thoát game. Chỉ hoạt động trên các core libretro." preset="switchauto">
    </feature>
