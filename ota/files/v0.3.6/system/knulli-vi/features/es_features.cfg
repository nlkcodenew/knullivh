    <feature name="CHẾ ĐỘ NĂNG LƯỢNG" group="TUỲ CHỌN NGUỒN ĐIỆN" value="powermode" description="Điều chỉnh hồ sơ tần số điện năng CPU khi đang chơi game. Một số hệ máy sẽ hưởng lợi nhờ khả năng xử lý điện áp được cải thiện.">
      <choice name="HIỆU NĂNG CAO" value="highperformance" />
      <choice name="CÂN BẰNG" value="balanced" />
      <choice name="TIẾT KIỆM NĂNG LƯỢNG" value="powersaver" />
    </feature>
    <feature name="CHẾ ĐỘ PIN" group="TUỲ CHỌN NGUỒN ĐIỆN" value="batterymode" description="Điều chỉnh hồ sơ điện năng CPU khi dùng pin. Ghi đè lên (các) Chế độ nguồn trước đó.">
      <choice name="HIỆU NĂNG CAO" value="highperformance" />
      <choice name="CÂN BẰNG" value="balanced" />
